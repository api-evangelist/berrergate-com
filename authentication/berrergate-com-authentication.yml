summary: >-
  BerrerGate has NO authentication scheme: the OpenAPI declares no securitySchemes and no security
  requirement, the A2A card declares securitySchemes {} and securityRequirements [], and no OAuth/OIDC
  metadata is served on any host. Every read route and the free preview POSTs answer anonymously. Access to
  the paid routes is gated economically, per request, by x402 payment: the first call returns HTTP 402 with
  PaymentRequirements, and the retry carries a PAYMENT-SIGNATURE header settling USDC on Base. There are no
  accounts, API keys, tokens or signups ("without creating a traditional account"). derive-authentication.py
  produced no profile because the contract declares nothing; this file was written from the observed
  requests and the provider's own docs.
