  operation: 'POST /v1/research'
  source: observed 402 on POST /v1/research — accepts[0].amount "20000" atomic USDC; skill.md "$0.020 USDC via x402 on Base when the market-fit canary is active"
- id: micro-inference
  name: BerrerGate Micro-Inference
  price: 0.00125-0.00225
  currency: USDC
  period: per call
  pricing_mode: DYNAMIC_PROFIT_GUARDED
  included: bounded managed-AI answer, no tools, no web, store=false
  limits: ['prompt <= 3,200 UTF-8 bytes', 'max_output_tokens 32-512', 'daily_max_calls 75', 'lifetime_max_calls 150', 'per_payer_daily_max_calls 25', 'state ACTIVE_WEEKEND_PILOT']
  operation: 'POST /v1/agent/utility/inference'
  source: https://api.berrergate.com/v1/agent/utility/catalog (min_price_atomic 1250, max_price_atomic 2250)
