model: pay-per-call in USDC on Base (eip155:8453) via x402; no subscription, no account, no card payments; a free tier needs nothing
summary: >-
  BerrerGate publishes no tiers and no pricing page. Prices are read from machine-readable catalog endpoints
  (all anonymous) and from the live 402 challenge; amounts are in atomic USDC (6 decimals) and converted
  here. On 2026-09-19 the paid surface was: five open-source stack decision packets at $0.01 each (state
  ACTIVE), the Evidence Brief at $0.020, micro-inference at a dynamic $0.00125-$0.00225 (ACTIVE_WEEKEND_PILOT
  with hard call caps), a $0.001 spend router that is STAGED_DISABLED, and a $0.01 one-shot canary. The
  homepage calls the whole paid surface a "limited x402 paid beta" that "may change".
plans:
- id: free
  name: Free discovery and previews
  price: 0
  currency: USDC
  period: per call
  included: >-
    GET /v1/agent/procurement/catalog + POST /v1/agent/procurement/preview (10 capability categories, all
    free_preview true); GET /v1/agent/discovery/sources + POST /v1/agent/discovery/preview (8 prewarmed
    sources, cache-only); GET /v1/agent/trial/catalog + POST /v1/agent/trial/query (32 products,
    not_for_sale true, payment_required false); GET /v1/agent/capabilities, /value-catalog,
    /wisdom/discovery; the A2A natural-language skills that route to the preview
  limits: ['x-idempotency-key required on POST /v1/agent/trial/query', 'cache-only — no upstream provider call on a customer query']
  source: https://api.berrergate.com/v1/agent/procurement/catalog
