apis:
- aid: berrergate-com:berrergate-mcp-server
  name: BerrerGate MCP Server
  description: >-
    Remote Model Context Protocol endpoint at https://api.berrergate.com/mcp (Streamable HTTP, POST only),
    declared in the provider's llms.txt, in an MCP server.json manifest at /.well-known/mcp/server.json
    (schema 2025-12-11, name com.berrergate/capability-wisdom, version 1.0.0) and in its AI Registry catalog
    as a "stateless MCP 2026-07-28 discovery/intake adapter" that hands out x402 purchase instructions
    but never settles money. The endpoint answers JSON-RPC 2.0 and demands MCP-Protocol-Version 2026-07-28,
    but rejected every standard initialize and tools/list shape with -32600, so its tool list could not
    be introspected; no credential is asked for and no OAuth metadata is served.
  humanURL: https://berrergate.com/status/
  baseURL: https://api.berrergate.com/mcp
