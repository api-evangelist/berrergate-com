- aid: berrergate-com:berrergate-a2a-agent
  name: BerrerGate A2A Agent
  description: >-
    Agent2Agent surface: an agent card served from https://api.berrergate.com/.well-known/agent-card.json
    (content-type application/a2a+json, version 2.9.0) declaring two interfaces — HTTP+JSON at /a2a/v1
    and JSON-RPC at /a2a/jsonrpc, each protocolVersion "1.0" — and twelve skills: four free discovery
    and preview skills, the $0.020 Evidence Brief, dynamic-priced micro-inference, a purchase-instructions
    skill and five $0.01 USDC open-source stack decision skills, all settled over x402 on Base. Streaming,
    push notifications and the extended card are declared unsupported; only message/send is implemented
    on the JSON-RPC endpoint. Registered in the Global A2A Registry on 2026-08-27 as a Verified agent.
  humanURL: https://www.a2a-registry.org/agent/com.berrergate.berrergate_capability_wisdom_agent
