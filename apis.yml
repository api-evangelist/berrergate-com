aid: berrergate-com
name: Berrer
description: >-
  Berrer runs BerrerGate (berrergate.com), an agent-native "tool and provider intelligence" service: an AI
  agent describes a task in natural language and BerrerGate maps it to agent-usable tools, APIs and provider
  categories, returns a free, cache-only procurement preview, and sells tightly bounded "decision packets" —
  evidence-backed shortlists of commercially cleared open-source implementations for observability,
  orchestration, scraping, analytics and browser automation — plus a paid Evidence Brief and a low-cost
  pay-per-call AI answer, all settled in USDC on Base through x402 with no account. The same surface is
  published three ways from api.berrergate.com: a 25-operation OpenAPI 3.1 contract at /openapi.json, an
  A2A agent card at /.well-known/agent-card.json with twelve skills (listed as Verified in the Global A2A
  Registry), and a remote MCP endpoint at /mcp declared in an MCP server.json manifest; discovery is rounded
  out by an x402 manifest, an AI Registry catalog, an llms.txt and a provider-written skill.md. The company
  states it is experimental, publishes no terms of service, no contact address and no pricing page.
