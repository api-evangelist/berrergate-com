overlay: 1.0.0
info:
  title: API Evangelist overlay for the BerrerGate Tool & Provider Intelligence API
  version: '2026-09-19'
  description: 'Generated 2026-09-19 (method: generated). Adds operationIds (the provider declares none), tags,
    x402 payment and idempotency annotations, and observed-behaviour notes to the verbatim provider spec. Every
    target path was verified to exist in openapi/berrergate-com-openapi.json.'
extends: ../openapi/berrergate-com-openapi.json
actions:
- target: $.info
  update:
