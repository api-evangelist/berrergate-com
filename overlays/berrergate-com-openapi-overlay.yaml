      profile: https://github.com/api-evangelist/berrergate-com
      note: Enhancements are applied by this overlay; the provider spec is kept verbatim in openapi/berrergate-com-openapi.json.
- target: $.servers[0]
  update:
    description: Production API host (the only host; berrergate.com is the website and www.berrergate.com answers
      522)
- target: $
  update:
