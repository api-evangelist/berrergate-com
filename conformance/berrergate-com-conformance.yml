summary: >-
  BerrerGate's conformance profile is the agent-commerce protocol stack: an A2A agent card in the 1.0 shape
  (supportedInterfaces[] with protocolVersion "1.0" on HTTP+JSON and JSON-RPC bindings), an MCP server that
  declares protocol version 2026-07-28 and publishes a server.json manifest on the 2025-12-11 schema, x402
  version 2 payments in USDC on Base (CAIP-2 eip155:8453) — VERIFIED live from a real HTTP 402 carrying the
  PAYMENT-REQUIRED header and an accepts[] block — JSON-RPC 2.0 on the A2A and MCP endpoints, an AI Registry
  Discovery catalog with a did:web identity, and a required x-idempotency-key header on every paid write. It
  declares no OAuth/OIDC, no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 9727 API catalog
  and no RFC 8594 sunset signalling. There is no sector standard for agent procurement intelligence; the
  x402 v2 payload and the A2A card are the contract-level signatures this market has.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '1.0'
  conforms: true
  evidence: >-
    a2a/berrergate-com-agent-card.json — supportedInterfaces [{url https://api.berrergate.com/a2a/v1,
    protocolBinding HTTP+JSON, protocolVersion "1.0"}, {url https://api.berrergate.com/a2a/jsonrpc,
    protocolBinding JSONRPC, protocolVersion "1.0"}], capabilities object, skills[] of 12, provider
    {Berrer, https://berrergate.com}; served with content-type application/a2a+json. POST
    https://api.berrergate.com/a2a/jsonrpc answers JSON-RPC 2.0 (-32601 Method not found for tasks/get and
    agent/getAuthenticatedExtendedCard — only SendMessage is implemented per the OpenAPI summary). Graded in
    a2a/berrergate-com-a2a.yml.
  domain_standard_signature: true
- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  verification: verified
  evidence: >-
    POST https://api.berrergate.com/v1/research with an x-idempotency-key and no payment returned HTTP 402
    with a PAYMENT-REQUIRED response header (base64 JSON) and body {"x402Version":2, "accepts":[{"scheme":
    "exact","network":"eip155:8453","amount":"20000","asset":"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",
    "payTo":"0x1090DDAf854Ff0f6A65F24a866C29C46fdDa0a8a","maxTimeoutSeconds":60,"extra":{"name":"USD Coin",
    "version":"2"}}], "resource":{...}, "extensions":{"bazaar":{...}}}. The server exposes payment-required
    and payment-response via Access-Control-Expose-Headers and accepts payment-signature. The provider also
    publishes /.well-known/x402.json (x402Version 2) — saved under well-known/. Nothing was paid.
  domain_standard_signature: true
  note: The 402 challenge, its header and its PaymentRequirements payload were all observed; only the settlement leg (PAYMENT-SIGNATURE retry) was not exercised.
