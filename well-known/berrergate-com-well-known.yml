    document, not a catch-all. NOT served on any host: security.txt (RFC 9116), openid-configuration,
    oauth-authorization-server, oauth-protected-resource (RFC 9728 — probed on the MCP host itself),
    api-catalog (RFC 9727), ai-plugin.json, mcp.json.
